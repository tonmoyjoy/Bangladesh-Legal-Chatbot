[project]
name = "bangladesh-legal-chatbot"
version = "2.0.0"
description = "Bilingual (Bangla/English) RAG chatbot for Bangladesh law with voice input"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.coverage.run]
source = ["legalbot", "ingest", "evals"]
omit = []

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".cache", "vectorstore"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random jitter is not cryptographic
    "RUF001", # Bangla / typographic characters are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]

[tool.mypy]
python_version = "3.12"
files = ["legalbot", "ingest.py", "evals", "app.py"]
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_calls = false
